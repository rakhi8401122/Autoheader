<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Dream Success Classes - Pro Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    :root { --primary-color: #5c67f2; --accent-color: #ff6b6b; --bg-color: #f0f2f5; --white: #ffffff; --success-color: #2ecc71; --review-color: #f39c12; }
    body { 
  font-family: 'Poppins', sans-serif; 
  background-color: #f0f2f5; 
  margin: 0 !important; 
  padding: 0 !important; 
  display: block !important;    /* Isse narrow strip khatam hogi */
  width: 100% !important; 
  overflow-x: hidden; 
}

    
  .container { 
  width: 100% !important;        /* 98% ko hata kar 100% kiya */
  max-width: 100% !important;    /* 1200px ki limit khatam kar di */
  background: var(--white); 
  min-height: 100vh; 
  padding: 15px; 
  box-sizing: border-box; 
  position: relative; 
  margin: 0 !important;          /* Side ke extra gaps khatam karne ke liye */
  transition: margin-right 0.3s; 
}


    /* Login Section */
    #nameInput { text-align: center; padding-top: 50px; display: flex; flex-direction: column; align-items: center; }
    .category-tag { font-size: 18px; font-weight: 600; color: #2d3436; margin-bottom: 5px; display: block; }
    h2 { color: var(--primary-color); margin: 0 0 25px 0; font-size: 26px; font-weight: 700; }
    #studentName { width: 90%; max-width: 400px; padding: 16px; font-size: 16px; border: 2px solid #edf2f7; border-radius: 12px; outline: none; margin-bottom: 20px; text-align: center; }
    .start-btn { width: 90%; max-width: 400px; padding: 18px; background: var(--primary-color); color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: 600; cursor: pointer; }

    /* Header & Top Progress Bar */
    #testContainer { display: none; width: 100%; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 10px; background: #fcfcfc; border-radius: 10px; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    #timer { font-size: 14px; font-weight: 600; color: var(--accent-color); background: #fff5f5; padding: 6px 12px; border-radius: 50px; border: 1px solid #ffe3e3; }
    #paletteToggle { background: var(--primary-color); color: white; border: none; width: 35px; height: 35px; border-radius: 8px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }

    #progressBar { width: 100%; background: #f1f3f5; height: 6px; border-radius: 10px; margin-bottom: 20px; overflow: hidden; }

    /* Question Styling */
    .question { font-size: 19px; font-weight: 600; margin-bottom: 15px; color: #2d3436; line-height: 1.6; padding: 10px 0; }
    .q-image { max-width: 100%; height: auto; border-radius: 10px; margin-bottom: 15px; display: block; border: 1px solid #eee; }
    .options { display: flex; flex-direction: column; gap: 12px; width: 100%; }
    .option-label { display: flex; align-items: center; padding: 16px; border: 2px solid #f1f3f5; border-radius: 12px; cursor: pointer; font-size: 16px; width: 100%; box-sizing: border-box; transition: 0.2s; background: #fff; }
    .option-label.selected { border-color: var(--primary-color); background: #f0f3ff; font-weight: 600; }

    /* Buttons Row */
    .buttons { display: flex; flex-direction: row; flex-wrap: nowrap; gap: 5px; margin-top: 30px; padding-bottom: 20px; width: 100%; justify-content: space-between; }
    .nav-btn { flex: 1; padding: 15px 5px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; font-size: 14px; text-align: center; white-space: nowrap; }
    .prev { background: #e9ecef; color: #495057; }
    .review-btn { background: var(--review-color); color: white; }
    .submit-mid { background: var(--accent-color); color: white; }
    .next { background: var(--primary-color); color: white; }

    /* Side Palette */
    #sidePalette { position: fixed; right: -320px; top: 0; width: 300px; height: 100%; background: white; box-shadow: -5px 0 15px rgba(0,0,0,0.1); transition: 0.3s; z-index: 1001; padding: 20px; box-sizing: border-box; }
    #sidePalette.open { right: 0; }
    .palette-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 20px; overflow-y: auto; max-height: 80vh; }
    .palette-btn { width: 50px; height: 50px; border-radius: 8px; border: 1px solid #ddd; background: #f8f9fa; cursor: pointer; font-weight: 600; display: flex; align-items: center; justify-content: center; }
    .palette-btn.answered { background: var(--success-color); color: white; border-color: var(--success-color); }
    .palette-btn.reviewed { background: var(--review-color); color: white; border-color: var(--review-color); }
    .palette-btn.current { border: 3px solid var(--primary-color); }

    /* PC Side Palette Fix */
    @media (min-width: 1025px) {
      .container { margin-right: 300px; width: calc(100% - 300px); max-width: 100%; }
      #sidePalette { right: 0 !important; border-left: 1px solid #eee; box-shadow: none; }
      #sidePalette button[onclick="togglePalette()"] { display: none; }
      #paletteToggle { display: none; }
    }

    @media (max-width: 767px) { 
      .buttons { position: fixed; bottom: 0; left: 0; background: white; padding: 10px 5px; box-shadow: 0 -5px 15px rgba(0,0,0,0.08); z-index: 999; gap: 4px; } 
      #testContainer { padding-bottom: 100px; } 
    }

    /* Summary Styling */
    .summary-header { background: #f0f3ff; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #dce3ff; text-align: center; }
    .summary-box { max-height: 350px; overflow-y: auto; background: #ffffff; padding: 5px; border-radius: 10px; text-align: left; }
    .sum-item { padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #eee; font-size: 13px; }
    .sum-correct { border-left: 5px solid var(--success-color); background: #f6fffa; }
    .sum-wrong { border-left: 5px solid var(--accent-color); background: #fffcfc; }
    .sum-skipped { border-left: 5px solid #ccc; background: #fafafa; }
  </style>
</head>
<body>

  <div class="container">
    <div id="nameInput">
      <span class="category-tag">📖 Lucent Online Quiz</span>
      <h2>Quiz : By Rahul Kumar</h2>
      <input type="text" id="studentName" placeholder="अपना नाम यहाँ लिखें..." autocomplete="off">
      <br>
      <button class="start-btn" onclick="startTest()">Start Online Test</button>
    </div>

    <div id="testContainer">
      <div class="top-bar">
        <span id="testTitle" style="font-weight:600; color:#555;">Candidate</span>
        <div class="header-right">
          <div id="timer">🕒 10:00</div>
          <button id="paletteToggle" onclick="togglePalette()">☰</button>
        </div>
      </div>
      <div id="progressBar"><div></div></div>
      <div id="quiz"></div>
      <div class="buttons">
        <button class="nav-btn prev" id="prevBtn" onclick="previousQuestion()">Previous</button>
        <button class="nav-btn review-btn" onclick="markReview()">Review</button>
        <button class="nav-btn submit-mid" onclick="triggerManualSubmit()">Submit</button>
        <button class="nav-btn next" id="nextBtn" onclick="handleNext()">Next</button>
      </div>
    </div>
  </div>

  <div id="sidePalette">
    <button style="width:100%; padding:10px; border:none; background:#eee; border-radius:8px; cursor:pointer;" onclick="togglePalette()">✕ Close Menu</button>
    <div class="palette-grid" id="paletteGrid"></div>
  </div>

<script>
  /*********************************************************
   * 1. CONFIGURATION (Yahan se edit karein)
   *********************************************************/
  // Apna JSON Link yahan daalein
  const JSON_LINK = "https://hitory8.pages.dev/history.json"; 
  
  // Test ka Samay (Seconds mein) - 600 = 10 Minute
  let timeLeft = 600; 
  
  // Negative Marking Kitni hogi?
  const NEGATIVE_MARK = 0.25; 

  /*********************************************************
   * 2. MAIN LOGIC (Dhyan se edit karein)
   *********************************************************/
  let questions = [], currentIdx = 0, userAns = [], reviewList = [], timerId = null, sName = "";

  function saveToLocal() {
    const data = { sName, questions, currentIdx, userAns, reviewList, timeLeft, isActive: true };
    localStorage.setItem('quiz_session_v2', JSON.stringify(data));
  }

  window.onload = function() {
    const savedData = localStorage.getItem('quiz_session_v2');
    if (savedData) {
      const data = JSON.parse(savedData);
      if (data.isActive) {
        Swal.fire({
          title: 'Resume Test?', text: "Pichla test jari rakhein?", icon: 'info',
          showCancelButton: true, confirmButtonText: 'Yes', cancelButtonText: 'No'
        }).then((result) => {
          if (result.isConfirmed) {
            sName = data.sName; questions = data.questions; currentIdx = data.currentIdx;
            userAns = data.userAns; reviewList = data.reviewList; timeLeft = data.timeLeft;
            launchTest();
          } else { localStorage.removeItem('quiz_session_v2'); }
        });
      }
    }
  };

  async function startTest() {
    sName = document.getElementById('studentName').value.trim();
    if(!sName) return Swal.fire('Oops!', 'Pehle apna naam likhein.', 'warning');
    
    Swal.fire({title: 'Loading Quiz...', didOpen: () => Swal.showLoading()});
    
    try {
      const response = await fetch(JSON_LINK);
      const data = await response.json();
      questions = [...data].sort(() => Math.random() - 0.5); // Shuffle
      userAns = new Array(questions.length).fill(null);
      reviewList = new Array(questions.length).fill(false);
      Swal.close();
      
      let elem = document.documentElement;
      if (elem.requestFullscreen) { elem.requestFullscreen(); }
      launchTest();
    } catch (e) {
      Swal.fire('Error', 'Data load nahi ho paya. Link check karein!', 'error');
    }
  }

  function launchTest() {
    document.getElementById('nameInput').style.display = 'none';
    document.getElementById('testContainer').style.display = 'block';
    loadQuestion();
    timerId = setInterval(() => {
      timeLeft--; saveToLocal();
      let m = Math.floor(timeLeft/60), s = timeLeft%60;
      document.getElementById('timer').innerText = `🕒 ${m}:${s<10?'0':''}${s}`;
      if(timeLeft <= 0) submitQuiz();
    }, 1000);
  }

  function loadQuestion() {
    const q = questions[currentIdx];
    document.getElementById('testTitle').innerText = sName;
    let imgHtml = q.image ? `<img src="${q.image}" class="q-image">` : '';
    document.getElementById('quiz').innerHTML = `
      <div class="question">(${currentIdx+1}/${questions.length}) ${q.question}</div>
      ${imgHtml}
      <div class="options">
        ${q.options.map(o => `<label class="option-label ${userAns[currentIdx] === o ? 'selected' : ''}" onclick="saveAns('${o}', this)"><span>${o}</span></label>`).join('')}
      </div>`;
    
    document.getElementById('prevBtn').disabled = currentIdx === 0;
    document.getElementById('nextBtn').innerText = currentIdx === questions.length - 1 ? 'Finish' : 'Next';
    document.getElementById('progressBar').firstElementChild.style.width = `${((currentIdx+1)/questions.length)*100}%`;
    renderPalette();
    saveToLocal();
  }

  function saveAns(val, el) {
    userAns[currentIdx] = val;
    reviewList[currentIdx] = false;
    document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
    el.classList.add('selected');
    renderPalette();
    saveToLocal();
  }

  function markReview() { reviewList[currentIdx] = true; saveToLocal(); handleNext(); }
  function togglePalette() { document.getElementById('sidePalette').classList.toggle('open'); }
  
  function renderPalette() {
    const grid = document.getElementById('paletteGrid'); grid.innerHTML = "";
    questions.forEach((_, i) => {
      const btn = document.createElement('button');
      btn.innerText = i + 1;
      btn.className = 'palette-btn';
      if(i === currentIdx) btn.classList.add('current');
      if(reviewList[i]) btn.classList.add('reviewed');
      else if(userAns[i]) btn.classList.add('answered');
      btn.onclick = () => { 
        currentIdx = i; loadQuestion(); 
        if(window.innerWidth <= 1024) togglePalette(); 
      };
      grid.appendChild(btn);
    });
  }

  function previousQuestion() { if(currentIdx > 0) { currentIdx--; loadQuestion(); } }
  function handleNext() { if(currentIdx < questions.length - 1) { currentIdx++; loadQuestion(); } else { triggerManualSubmit(); } }

  function triggerManualSubmit() {
    Swal.fire({ title: 'Submit Test?', text: 'Kya aap test khatam karna chahte hain?', icon: 'question', showCancelButton: true }).then(r => { if(r.isConfirmed) submitQuiz(); });
  }

  async function submitQuiz() {
    clearInterval(timerId);
    localStorage.removeItem('quiz_session_v2');
    if (document.fullscreenElement) { document.exitFullscreen(); }

    let rawScore = 0, correctCount = 0, wrongCount = 0, summaryHtml = "";
    questions.forEach((q, i) => {
      let isCorrect = userAns[i] === q.answer;
      let statusClass = isCorrect ? 'sum-correct' : (userAns[i] ? 'sum-wrong' : 'sum-skipped');
      if(userAns[i]) {
          if(isCorrect) { correctCount++; rawScore += 1; }
          else { wrongCount++; rawScore -= NEGATIVE_MARK; }
      }
      summaryHtml += `<div class="sum-item ${statusClass}">
        <b>Q${i+1}: ${q.question}</b><br>
        Your Ans: ${userAns[i] || 'Skipped'} ${isCorrect ? '✅' : (userAns[i] ? '❌ (-' + NEGATIVE_MARK + ')' : '')}<br>
        <span style="color:green; font-weight:600;">Correct: ${q.answer}</span>
      </div>`;
    });

    let finalScore = rawScore.toFixed(2);
    let totalQ = questions.length;
    let percent = ((rawScore / totalQ) * 100).toFixed(1);
    if(percent < 0) percent = 0; // Negative percent handle

    await Swal.fire({ title: 'Submitted!', text: 'Result loading...', icon: 'success', timer: 1500, showConfirmButton: false });

    Swal.fire({
      title: 'Performance Report', width: '98%',
      html: `
        <div class="summary-header">
           <h3 style="margin:0; color:#5c67f2;">${sName}</h3>
           <p style="font-size:18px; margin:5px 0 0 0;">Score: <b>${finalScore}/${totalQ}</b></p>
           <p style="font-size:15px; margin:5px 0 0 0;">Result: <b>${percent}%</b></p>
           <p style="font-size:12px; color:#666;">Correct: ${correctCount} | Wrong: ${wrongCount}</p>
        </div>
        <div class="summary-box">${summaryHtml}</div>
      `,
      confirmButtonText: 'Restart', allowOutsideClick: false
    }).then(() => location.reload());
  }
</script>
</body>
</html>
